[project]
name = "pysparkpipe"
version = "0.1.4"
description = "Flow orchestrator for data transformations within the context of pyspark.sql.GroupedData.applyInPandas"
authors = [{ name = "Santiago Armstrong", email = "santiagoarmstrong@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "pyspark>=3.2.1",
  "pandas>=1.4.3,<3.0.0",
  "numpy>=1.26.0",
  "pyarrow>=7.0.0",
  "pandera[pandas]>=0.26.0,<0.27.0",
  "typeguard>=4.1.1,<5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=7.1.3,<8.0.0",
  "autopep8>=2.0.2,<3.0.0",
  "docformatter>=1.7.5,<2.0.0",
  "pylint>=2.17.5,<3.0.0",
  "flake8>=6.1.0,<7.0.0",
  "mypy>=1.4.1,<2.0.0",
  "isort>=5.12.0,<6.0.0",
  "bandit>=1.7.5,<2.0.0",
  "black>=23.7.0,<24.0.0",
  "pre-commit>=3.3.3,<4.0.0",
]

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 79

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
