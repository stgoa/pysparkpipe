name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: >
          uv run pytest -s -vvv
          --cov=pysparkpipe --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    # Uses the existing flake8/black/isort/mypy/bandit/pylint toolchain
    # (tox.ini's [testenv:lint]); to be replaced by ruff in a follow-up PR.
    # mypy/pylint have pre-existing findings on current code (not introduced
    # by this workflow) and were never gated by .pre-commit-config.yaml
    # either, so they run as non-blocking here, matching tox's existing
    # `ignore_errors = True` for this env.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: flake8
        run: uv run flake8 --config=tox.ini pysparkpipe

      - name: black --check
        run: uv run black --check pysparkpipe

      - name: isort --check-only
        run: uv run isort --check-only pysparkpipe

      - name: bandit
        run: >
          uv run bandit --ini=tox.ini --quiet --recursive
          -x **/.venv/**/*.py pysparkpipe

      - name: mypy (non-blocking, pre-existing findings)
        continue-on-error: true
        run: uv run mypy --config-file=tox.ini -p pysparkpipe

      - name: pylint (non-blocking, pre-existing findings)
        continue-on-error: true
        run: uv run pylint --rcfile=tox.ini pysparkpipe

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tester image
        run: docker build --target tester .
