name: Publish Python package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -s -vvv

  publish:
    needs: test
    runs-on: ubuntu-latest
    # NOTE: requires a PyPI Trusted Publisher configured for this repo/workflow
    # at pypi.org -> project pysparkpipe -> Publishing, pointing at
    # stgoa/pysparkpipe, workflow "publish.yml". That's a manual, one-time
    # step on pypi.org -- publishing will fail with 403 until it's done.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
